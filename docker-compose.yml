version: "3"

services:
  gitlab-ai-reviewer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - GITLAB_URL=${GITLAB_URL}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - EXPECTED_GITLAB_TOKEN=${EXPECTED_GITLAB_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      # Uncomment if using Anthropic Claude models
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    # For secure deployments, consider using Docker Secrets
    # or a dedicated secrets management solution instead of
    # environment variables for API keys
